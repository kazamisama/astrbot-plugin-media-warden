name: astrbot-plugin-media-warden
author: shirley
version: 1.20.2
repo: https://github.com/kazamisama/astrbot-plugin-media-warden
description: 群聊素材守门人 v1.20.2 —— 监听特定群/用户的非文字消息，按模板命名落盘（blake2b 去重），转发链 PIL 渲染/JSON 保存，SQLite 索引 + /warden list/stats/export/lookup/prune/fail 命令 + 预览图回传 + 并发下载 + 指数退避重试 + 源链接失效补救（QQ 本地缓存按 MD5（普通图片/转发节点图）/ OneBot get_image 多形态重取 + get_msg 重解析 / 组件本地副本 / 迟到缓存重查）+ 失败分类与入库 + 聊天记录存档/原地重发 + dashboard 分类管理页面（v1.13.0）+ 六类保存开关与扩展名白名单 + 纯文本/聊天记录双形态条目 + 跨群转发与自动转发 + 渲染样式页（v1.14.0），渲染开关布尔化与内联节点存档修复（v1.16.0），共享文件按行删除与语音开关、旧渲染图清理、存档统计（v1.17.0），原地转发按 NapCat 短 id 缓存判定、跨群同样保装扮（v1.17.1），存档页与样式页都整页固定、面板各自滚动（v1.17.2/v1.17.3），复用条目不再重复自动转发（v1.17.3），一次性数据归一化 + 删除全部旧数据兼容分支（v1.18.0），长函数拆分与静默异常收拢（v1.18.1），索引路径写法归一与共用文件标记（v1.18.2），存档内视频落字节 + 页面内联播放 + 重建带视频（v1.19.0），内容去重忽略 rkey 与「补齐缺失媒体」按钮/命令（v1.20.0），关渲染图时节点图不再漏下（v1.20.1），补齐结果提示如实（v1.20.2），命令仅管理员可用。
